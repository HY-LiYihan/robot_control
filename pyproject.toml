[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-control"
version = "0.1.0"
description = "Unified Piper and FR3 MuJoCo control, Piper real control and D435i RGB-D"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "typer>=0.9"]

[project.optional-dependencies]
# The pinned Pinocchio wheel links against urdfdom 4 and TinyXML2 10.
mujoco = ["mujoco>=3.2.7", "pin==3.9.0", "cmeel-urdfdom>=4,<5", "cmeel-tinyxml2>=10,<11", "Pillow>=10"]
real = ["python-can>=3.3.4", "pin==3.9.0", "cmeel-urdfdom>=4,<5", "cmeel-tinyxml2>=10,<11"]
camera = ["pyrealsense2>=2.50", "Pillow>=10"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
piper = "robot_control.cli:app"
robot_control = "robot_control.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robot_control = ["assets/scenes/*.xml"]
"robot_control.fr3" = ["assets/scenes/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
